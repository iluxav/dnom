        <path d="M 464,197 H 500 Q 508,197 508,189 V 96 Q 508,88 516,88 H 552" fill="none" stroke="#739fdf" stroke-width="1.2" marker-end="url(#dnom-architecture-dark-arrow-link)"/>
        <line x1="632" y1="120" x2="632" y2="176" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dnom-architecture-dark-arrow)"/>
