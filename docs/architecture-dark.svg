        <rect x="740" y="188" width="24" height="12" rx="2" fill="#2d3142"/>
        <text x="752" y="197" fill="#949eb2" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">LOG</text>
