        <rect x="84" y="148" width="104" height="12" rx="2" fill="#2d3142"/>
        <text x="136" y="157" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.14em">SENSOR · PICK ONE</text>
        <rect x="288" y="144" width="440" height="112" rx="8" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="0.8" fill-opacity="0.02" stroke-opacity="0.10"/>
