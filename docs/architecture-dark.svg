<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dnom-architecture-dark-title dnom-architecture-dark-desc" id="dnom-architecture-dark-root">
        <title id="dnom-architecture-dark-title">How dnom works</title>
        <desc id="dnom-architecture-dark-desc">A sensor (dnom's own eBPF collector or Falco) sends events to dnom classify, which groups them into episodes, asks a decision model about each one, applies policy rules to the model's answers and to model-free facts, and writes every result to an audit trail and optional webhook alerts.</desc>
        <defs>
      <style>#dnom-architecture-dark-root { --color-paper: #2d3142;
      --color-ink: #f5f5f5;
      --color-muted: #bfc0c0;
      --color-accent: #f08a59;
      --font-sans: 'Geist', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace; }
      #dnom-architecture-dark-root { font-family: var(--font-sans); color: var(--color-ink); }
      #dnom-architecture-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#dnom-architecture-dark-root .diagram-container { overflow-x: visible; }
}</style>
