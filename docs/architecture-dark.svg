        <rect x="56" y="176" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="56" y="176" width="160" height="64" rx="6" fill="#bfc0c0" stroke="#949eb2" stroke-width="1" fill-opacity="0.10"/>
        <rect x="64" y="184" width="28" height="12" rx="2" fill="none" stroke="#949eb2" stroke-width="0.8" stroke-opacity="0.40"/>
