        <text x="326" y="193" fill="#f08a59" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
        <text x="384" y="212" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Episodes</text>
        <text x="384" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">one per process tree</text>
        <!-- Node: Decision model -->
        <rect x="552" y="56" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="552" y="56" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="560" y="64" width="28" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="574" y="73" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">AI</text>
        <text x="632" y="92" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Decision model</text>
        <text x="632" y="108" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Jev · Kev · Ollama</text>
        <!-- Node: Policies -->
