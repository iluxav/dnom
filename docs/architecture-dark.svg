        <text x="848" y="228" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">dnom audit · monitor</text>
        <!-- Node: Webhook -->
        <rect x="776" y="288" width="144" height="64" rx="6" fill="#2d3142"/>
        <rect x="776" y="288" width="144" height="64" rx="6" fill="#f5f5f5" stroke="#f5f5f5" stroke-width="1" fill-opacity="0.03" stroke-opacity="0.30"/>
        <rect x="784" y="296" width="28" height="12" rx="2" fill="none" stroke="#f5f5f5" stroke-width="0.8" stroke-opacity="0.22"/>
        <text x="798" y="305" fill="#949eb2" font-size="7" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>
        <text x="848" y="324" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Webhook</text>
        <text x="848" y="340" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">optional alerts</text>

