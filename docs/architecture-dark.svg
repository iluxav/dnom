        <text x="136" y="324" fill="#f5f5f5" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Falco</text>
        <text x="136" y="340" fill="#bfc0c0" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">catch-all rules file</text>
        <!-- Node: Episodes -->
        <rect x="304" y="176" width="160" height="64" rx="6" fill="#2d3142"/>
        <rect x="304" y="176" width="160" height="64" rx="6" fill="#f08a59" stroke="#f08a59" stroke-width="1" fill-opacity="0.10"/>
