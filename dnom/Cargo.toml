[package]
name = "dnom"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
dnom-common = { path = "../dnom-common" }

anyhow = { workspace = true }
aya = { workspace = true }
clap = { workspace = true }
humantime = { workspace = true }
libc = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net", "signal", "time"] }
ureq = { workspace = true }
unicode-width = { workspace = true }
serde-saphyr = { workspace = true }

[build-dependencies]
anyhow = { workspace = true }
aya-build = { workspace = true }
cargo_metadata = { workspace = true }
# Not an artifact dependency (see aya-template); listed so cargo rebuilds when the eBPF crate changes.
dnom-ebpf = { path = "../dnom-ebpf" }

[[bin]]
name = "dnom"
path = "src/main.rs"
